name: Protocol or SDK proposal
description: Propose a bounded protocol, SDK, schema, or documentation change.
title: "[Proposal]: "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or protocol problem without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: State the observable result and acceptance criteria.
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Potential impact
      options:
        - label: Financial state or money movement
        - label: Authority, custody, or governance
        - label: Contract, ABI, SDK, event, or schema compatibility
        - label: Deployment or chain configuration
